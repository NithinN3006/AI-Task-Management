version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: task_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: task_management
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    # REPLACE "your-dockerhub-username" below with your actual username
    image: nithin675/ai-task-management-backend:latest
    container_name: task_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=task_management
      - DB_USER=root
      - DB_PASSWORD=root
      - JWT_SECRET=this_is_a_very_secure_secret_for_local_development_only_12345
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - app-network
    depends_on:
      - postgres

  frontend:
    # REPLACE "your-dockerhub-username" below with your actual username
    image: nithin675/ai-task-management-frontend:latest
    container_name: task_frontend
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
